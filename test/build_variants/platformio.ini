; Regression build: one firmware that links and runs ML-DSA-44, 65 and 87.
;
; It guards against the multilevel link failure, where the level-65/87 units
; referenced shared code under a prefix no other unit defined. A sketch that
; only uses MLDSA44 does not catch that, because the linker discards the
; unused level-65/87 sections.
;
;   pio run                         build for every environment
;   pio run -e <env> -t upload      flash one board
;
; The library is taken from this repository, not from the registry.

[env]
platform = espressif32
framework = arduino
lib_deps = symlink://../..
monitor_speed = 115200

[env:esp32dev]
board = esp32dev

[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1

[env:lilygo-t-display-s3]
board = lilygo-t-display-s3

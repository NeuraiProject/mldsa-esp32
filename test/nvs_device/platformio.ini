; On-device tests of the NVS key storage helpers. They write to the NVS
; partition of the board, in namespaces of their own, and clean up after.
;
;   functional   save, load, migrate, erase, and a save refused for lack of
;                space, on real NVS
;   powercut     saves keys in a loop while test/nvs_device/powercut.py
;                resets the board at random moments; after every reset a
;                whole identity must load
;
;   pio run -d test/nvs_device -e functional -t upload
;   pio run -d test/nvs_device -e powercut -t upload
;   python3 test/nvs_device/powercut.py /dev/ttyACM0 100

[env]
platform = espressif32
framework = arduino
board = lilygo-t-display-s3
lib_deps = symlink://../..
monitor_speed = 115200

[env:functional]

[env:powercut]
build_flags = -DNVS_POWERCUT

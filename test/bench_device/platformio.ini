; Measurement firmware: time and stack use of keygen, sign and verify for
; ML-DSA-44, 65 and 87 on a real board. The -nvs environment also measures
; which key records fit in the default NVS partition; it writes to NVS.
;
;   pio run -d test/bench_device -e <env> -t upload
;   pio device monitor -d test/bench_device
;
; Results are recorded in docs/measurements.md.

[env]
platform = espressif32
framework = arduino
lib_deps = symlink://../..
monitor_speed = 115200
; Makes the library's allocator report its peak use.
build_flags = -DMLDSA_ESP32_ALLOC_STATS

[env:esp32dev]
board = esp32dev

[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1

[env:lilygo-t-display-s3]
board = lilygo-t-display-s3

[env:lilygo-t-display-s3-nvs]
board = lilygo-t-display-s3
build_flags = -DMLDSA_ESP32_ALLOC_STATS -DBENCH_NVS

; Working memory on the stack of the calling task instead of the heap.
[env:lilygo-t-display-s3-stack]
board = lilygo-t-display-s3
build_flags = -DMLDSA_ESP32_USE_STACK

; Faster signing at the cost of memory (see mldsa_native_config.h).
[env:lilygo-t-display-s3-fast]
board = lilygo-t-display-s3
build_flags = -DMLDSA_ESP32_NO_REDUCE_RAM -DMLDSA_ESP32_USE_STACK -DBENCH_STACK_BYTES=126976

; Default build with the Wi-Fi radio on (a soft access point).
[env:lilygo-t-display-s3-wifi]
board = lilygo-t-display-s3
build_flags = -DMLDSA_ESP32_ALLOC_STATS -DBENCH_WIFI

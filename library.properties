sentence=ML-DSA (FIPS 204) post-quantum digital signatures for ESP32. Supports all three security levels: ML-DSA-44, ML-DSA-65 and ML-DSA-87.
paragraph=Post-quantum digital signature scheme of the FIPS 204 standard (formerly Dilithium), built on mldsa-native v2.0.0. Key generation, signing and verification for all three NIST security levels in about 3 KB of stack and 9 to 22 KB of heap, with a registrable random source and key storage in NVS.

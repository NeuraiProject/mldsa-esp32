sentence=ML-DSA (FIPS 204) post-quantum digital signatures for ESP32. Supports all three security levels: ML-DSA-44, ML-DSA-65 and ML-DSA-87.
paragraph=Post-quantum digital signature scheme based on the FIPS 204 standard (formerly Dilithium). Ported from the mldsa-native reference implementation with ESP32 hardware RNG support and memory optimizations for embedded use. Provides keygen, sign, and verify operations for all three NIST security levels.
